<!doctype html>
<!--
  Pathly-Figur als echtes 3D-Modell (Three.js). Nicht KI-generiert: Alle Formen stehen hier im Code.
  Öffnen über figur-server.mjs. Das Bild landet als PNG mit transparentem Hintergrund im selben Ordner.
-->
<meta charset="utf-8" />
<title>Pathly-Figur</title>
<style>
  body { margin: 0; background: #cddceb; }
  canvas { max-height: 96vh; width: auto; display: block; margin: auto; }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<script type="module">
  import * as THREE from "three";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  // Markenfarben aus docs/brand-identity.md
  const C = {
    primary: 0x044b39, // Talar und Hut
    primaryDark: 0x033527,
    emerald: 0x1ea97b, // Hose und Buch
    lime: 0xcbf39d, // Kragen
    green: 0x72c613, // Quaste
    forest: 0x053438, // Schuhe
    skin: 0xf3cba6,
    hair: 0x2e1d14,
  };

  const W = 1200, H = 1800;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping; // erhält die Markenfarben
  renderer.toneMappingExposure = 0.92;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.38;

  const camera = new THREE.PerspectiveCamera(20, W / H, 0.1, 100);
  camera.position.set(1.4, 3.0, 17);
  camera.lookAt(0, 2.6, 0);

  const key = new THREE.DirectionalLight(0xffffff, 1.9);
  key.position.set(4, 8, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 6, bottom: -1, near: 1, far: 25 });
  key.shadow.bias = -0.0004;
  key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdff5ff, 0.6);
  rim.position.set(-5, 5, -5);
  scene.add(rim);

  // Weiches Material wie Vinyl-Spielzeug
  const mat = (color, roughness = 0.5, clearcoat = 0.25) =>
    new THREE.MeshPhysicalMaterial({ color, roughness, clearcoat, clearcoatRoughness: 0.45 });

  const add = (geometry, material, parent = scene) => {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  };
  const sphere = (r, material, [x, y, z], [sx, sy, sz] = [1, 1, 1], parent = scene) => {
    const m = add(new THREE.SphereGeometry(r, 64, 48), material, parent);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    return m;
  };
  const tube = (points, radius, material, parent = scene) =>
    add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p))), 64, radius, 24), material, parent);
  const v = (...a) => new THREE.Vector2(...a);

  const skin = mat(C.skin, 0.62, 0.05);
  const gown = mat(C.primary, 0.7, 0);

  // Beine und Schuhe
  for (const side of [-1, 1]) {
    const leg = add(new THREE.CylinderGeometry(0.2, 0.21, 1.0, 32), mat(C.emerald, 0.7, 0));
    leg.position.set(side * 0.34, 0.68, 0);
    sphere(0.3, mat(C.forest, 0.42, 0.25), [side * 0.36, 0.17, 0.14], [1, 0.58, 1.5]);
  }

  // Talar mit Falten
  const gownGeo = new THREE.LatheGeometry(
    [v(0.0, 0.85), v(1.02, 0.85), v(1.03, 0.92), v(0.94, 1.3), v(0.82, 1.8), v(0.7, 2.3), v(0.58, 2.68), v(0.34, 2.88), v(0, 2.92)],
    128,
  );
  const pos = gownGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const angle = Math.atan2(z, x);
    const fold = 1 + Math.sin(angle * 11) * 0.035 * THREE.MathUtils.clamp((2.2 - y) / 1.3, 0, 1);
    pos.setXYZ(i, x * fold, y, z * fold * 0.82);
  }
  gownGeo.computeVertexNormals();
  add(gownGeo, gown);

  // Kragen in Lime
  const collarGeo = new THREE.LatheGeometry([v(0.66, 2.34), v(0.68, 2.42), v(0.6, 2.66), v(0.38, 2.88), v(0.3, 2.95), v(0.27, 2.93)], 96);
  const collar = add(collarGeo, mat(C.lime, 0.65, 0));
  collar.scale.z = 0.86;

  // Hals und Kopf
  const neck = add(new THREE.CylinderGeometry(0.25, 0.27, 0.3, 32), skin);
  neck.position.y = 2.98;
  const head = new THREE.Group();
  head.position.y = 3.76;
  head.rotation.z = 0.03;
  head.scale.setScalar(0.88);
  scene.add(head);
  sphere(1, skin, [0, 0, 0], [1.06, 1, 1], head);
  for (const side of [-1, 1]) sphere(0.2, skin, [side * 1.05, -0.08, 0], [0.7, 1, 1], head);

  // Haare: Kappe, die vorne den Haaransatz freilässt, und eine kleine Stirnlocke
  const hair = add(new THREE.SphereGeometry(1.05, 64, 32, 0, Math.PI * 2, 0, 1.42), mat(C.hair, 0.7, 0.1), head);
  hair.scale.x = 1.07;
  hair.rotation.x = -0.32;
  tube([[-0.34, 0.66, 0.74], [-0.08, 0.57, 0.84], [0.2, 0.62, 0.78]], 0.055, mat(C.hair, 0.7, 0.1), head);

  // Gesicht
  for (const side of [-1, 1]) {
    sphere(0.21, mat(0xffffff, 0.2, 0.6), [side * 0.37, -0.02, 0.86], [1, 1.1, 0.5], head);
    sphere(0.135, mat(0x14231f, 0.15, 0.9), [side * 0.37, -0.02, 0.95], [1, 1.1, 0.55], head);
    sphere(0.042, mat(0xffffff, 0.1, 1), [side * 0.37 + 0.05, 0.05, 1.015], [1, 1, 0.6], head);
    const brow = add(new THREE.CapsuleGeometry(0.035, 0.24, 8, 16), mat(C.hair, 0.7, 0), head);
    brow.position.set(side * 0.37, 0.3, 0.9);
    brow.rotation.z = Math.PI / 2 + side * 0.1;
  }
  sphere(0.075, mat(0xe9b38d, 0.5, 0.2), [0, -0.2, 1.0], [1, 0.9, 1], head);
  const mouth = add(new THREE.TorusGeometry(0.2, 0.026, 12, 48, Math.PI * 0.8), mat(0x7a3524, 0.5, 0.2), head);
  mouth.position.set(0, -0.32, 0.93);
  mouth.rotation.set(0.15, 0, Math.PI + Math.PI * 0.1);

  // Absolventenhut
  const hat = new THREE.Group();
  hat.position.set(0, 3.76, 0);
  hat.rotation.set(-0.1, 0, 0.05);
  hat.scale.setScalar(0.88);
  scene.add(hat);
  const band = add(new THREE.CylinderGeometry(0.9, 0.98, 0.5, 64), mat(C.primaryDark, 0.7, 0), hat);
  band.position.y = 0.72;
  const board = add(new THREE.BoxGeometry(2.25, 0.08, 2.25), mat(C.primary, 0.6, 0.05), hat);
  board.position.y = 1.0;
  board.rotation.y = Math.PI / 4;
  const button = sphere(0.09, mat(C.green, 0.4, 0.3), [0, 1.06, 0], [1, 0.6, 1], hat);
  button.castShadow = false;
  const cord = mat(C.green, 0.45, 0.2);
  tube([[0, 1.07, 0], [-0.8, 1.06, 0.05], [-1.5, 1.05, 0.08], [-1.58, 0.75, 0.1], [-1.58, 0.42, 0.1]], 0.024, cord, hat);
  sphere(0.08, cord, [-1.58, 0.4, 0.1], [1, 1, 1], hat);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const strand = add(new THREE.CapsuleGeometry(0.028, 0.34, 6, 12), cord, hat);
    strand.position.set(-1.58 + Math.cos(a) * 0.05, 0.14, 0.1 + Math.sin(a) * 0.05);
    strand.rotation.z = Math.cos(a) * 0.1;
  }

  // Arme, die das Buch halten
  const sleeve = mat(C.primary, 0.7, 0);
  for (const side of [-1, 1]) {
    const shoulder = [side * 0.6, 2.56, 0];
    tube([shoulder, [side * 1.02, 2.1, 0.08], [side * 1.0, 1.72, 0.55], [side * 0.68, 1.62, 0.95]], 0.235, sleeve);
    sphere(0.25, sleeve, shoulder);
    sphere(0.185, skin, [side * 0.5, 1.58, 1.14], [1.1, 0.85, 1]);
  }

  // Buch mit Pathly-Logo
  const logo = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = "/logo-weiss.png";
  });
  const face = document.createElement("canvas");
  face.width = 1040; face.height = 760;
  const fc = face.getContext("2d");
  fc.fillStyle = "#1ea97b";
  fc.fillRect(0, 0, face.width, face.height);
  const logoW = 680, logoH = (logoW * logo.height) / logo.width;
  fc.drawImage(logo, (face.width - logoW) / 2, (face.height - logoH) / 2, logoW, logoH);
  const faceTex = new THREE.CanvasTexture(face);
  faceTex.colorSpace = THREE.SRGBColorSpace;
  faceTex.anisotropy = 16;
  const cover = mat(C.emerald, 0.6, 0.05);
  const pages = mat(0xf7f5e8, 0.8, 0);
  const book = add(new THREE.BoxGeometry(1.5, 1.08, 0.2), [
    cover, pages, pages, pages,
    new THREE.MeshPhysicalMaterial({ map: faceTex, roughness: 0.6, clearcoat: 0.05 }),
    cover,
  ]);
  book.position.set(0, 2.03, 1.05);
  book.rotation.x = -0.1;

  renderer.render(scene, camera);
  renderer.render(scene, camera);

  const blob = await new Promise((r) => renderer.domElement.toBlob(r, "image/png"));
  const res = await fetch("/save", { method: "POST", body: blob });
  document.title = res.ok ? "Gespeichert" : "Fehler beim Speichern";
</script>
